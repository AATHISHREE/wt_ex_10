
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Green Garden Blog - Registration</title>

    <style>

        body {
            font-family: Arial;
            background-color: #eef7ee;
            margin: 0;
            color: #333;
        }

        header {
            background-color: darkgreen;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 65%;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        h2 {
            color: darkgreen;
            text-align: center;
        }

        .form-group {
            margin: 15px 0;
        }

        label {
            display: inline-block;
            width: 140px;
            color: darkgreen;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        input[type="email"],
        select {
            width: 220px;
            padding: 9px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
        }

        button {
            background-color: green;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }

        .submit {
            text-align: center;
            margin-top: 20px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }

    </style>

</head>

<body>

    <header>

        <h1>🌿 Green Garden Blog</h1>

        <p>Grow Plants. Grow Happiness.</p>

    </header>


    <div class="container">

        <h2>User Registration Form</h2>

        <p style="text-align:center;">
            Join our gardening community!
        </p>

        <form action="/server" method="POST" id="registerForm">

            <!-- Name -->

            <div class="form-group">

                <label>Name:</label>

                <input type="text"
                    name="name"
                    placeholder="Enter your name"
                    pattern="[A-Za-z ]+"
                    title="Name must contain only letters"
                    required>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label>Password:</label>

                <input type="password"
                    name="password"
                    placeholder="Enter password"
                    pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"
                    title="Must contain uppercase, lowercase, number and at least 8 characters"
                    required>

            </div>


            <!-- Age -->

            <div class="form-group">

                <label>Age:</label>

                <input type="number"
                    name="age"
                    min="18"
                    max="30"
                    placeholder="Enter age"
                    required>

            </div>


            <!-- Mobile Number -->

            <div class="form-group">

                <label>Mobile Number:</label>

                <input type="text"
                    name="mobile"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    placeholder="10 digit number"
                    required>

            </div>


            <!-- Email -->

            <div class="form-group">

                <label>Email:</label>

                <input type="email"
                    name="email"
                    placeholder="Enter email"
                    required>

            </div>


            <!-- Gender -->

            <div class="form-group">

                <label>Gender:</label>

                <input type="radio"
                    name="gender"
                    value="Male"
                    required> Male

                <input type="radio"
                    name="gender"
                    value="Female"> Female

            </div>


            <!-- State -->

            <div class="form-group">

                <label>State:</label>

                <select name="state" required>

                    <option value="">Select State</option>

                    <option>Tamil Nadu</option>

                    <option>Kerala</option>

                    <option>Karnataka</option>

                    <option>Andhra Pradesh</option>

                    <option>Telangana</option>

                    <option>Maharashtra</option>

                    <option>Delhi</option>

                </select>

            </div>


            <!-- Skills -->

            <div class="form-group">

                <label>Skills:</label>

                <input type="checkbox"
                    name="skills"
                    value="Gardening"> Gardening

                <br>

                <label></label>

                <input type="checkbox"
                    name="skills"
                    value="Plant Care"> Plant Care

                <input type="checkbox"
                    name="skills"
                    value="Organic Farming"> Organic Farming

            </div>


            <!-- Submit -->

            <div class="submit">

                <button type="submit">Submit</button>

            </div>

        </form>

    </div>


    <footer>

        <p>Green Garden Blog | Learn • Grow • Stay Green</p>

    </footer>


    <script>

        document.getElementById("registerForm").addEventListener("submit", function(event) {

            var skills = document.querySelectorAll(
                'input[name="skills"]:checked'
            );

            if (skills.length === 0) {

                event.preventDefault();

                alert("Please select at least one skill.");

            }

        });

    </script>

</body>

</html>
